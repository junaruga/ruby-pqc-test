name: DRb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  druby:
    name: druby
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4

      - &setup-ruby
        name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Run druby server and client
        run: |
          script/run_druby_server.rb &
          sleep 3
          script/run_druby_client.rb

  drbssl:
    name: drbssl auto-generated RSA
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl

      # Reinstall openssl gem against custom OpenSSL >= 3.6 to some methods
      # enabled for compiling OpenSSL >= 3.6
      - &reinstall-openssl-gem
        name: Reinstall openssl gem against custom OpenSSL
        run: gem install openssl -- --with-openssl-dir=$HOME/openssl

      - name: Run drbssl server and client
        run: |
          script/run_drbssl_server_rsa_auto_generated.rb &
          sleep 3
          script/run_drbssl_client_rsa_auto_generated.rb

  drbssl-rsa:
    name: drbssl pre-generated RSA
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl
      - *reinstall-openssl-gem

      - name: Setup
        run: script/setup.sh

      - name: Run drbssl RSA server and client
        run: |
          script/run_drbssl_server_rsa_pre_generated.rb &
          sleep 3
          script/run_drbssl_client_rsa_pre_generated.rb

  drbssl-mldsa65:
    name: drbssl pre-generated ML-DSA-65
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl
      - *reinstall-openssl-gem

      - name: Setup
        run: script/setup.sh

      - name: Run drbssl ML-DSA-65 server and client
        run: |
          script/run_drbssl_server_mldsa65_pre_generated.rb &
          sleep 3
          script/run_drbssl_client_mldsa65_pre_generated.rb

  drbssl-rsa-client-cert:
    name: drbssl pre-generated RSA with client cert
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl
      - *reinstall-openssl-gem

      - name: Setup
        run: script/setup.sh

      - name: Run drbssl RSA client cert server and client
        run: |
          script/run_drbssl_server_rsa_client_cert_pre_generated.rb &
          sleep 3
          script/run_drbssl_client_rsa_client_cert_pre_generated.rb

  drbssl-mldsa65-client-cert:
    name: drbssl pre-generated ML-DSA-65 with client cert
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl
      - *reinstall-openssl-gem

      - name: Setup
        run: script/setup.sh

      - name: Run drbssl ML-DSA-65 client cert server and client
        run: |
          script/run_drbssl_server_mldsa65_client_cert_pre_generated.rb &
          sleep 3
          script/run_drbssl_client_mldsa65_client_cert_pre_generated.rb

  drbssl-mldsa65-generated:
    name: drbssl auto-generated ML-DSA-65 (development)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl
      - *reinstall-openssl-gem

      - name: Clone drb
        run: git clone -b wip/support-pqc https://github.com/junaruga/ruby-drb.git ~/git/ruby/drb

      - name: Run drbssl ML-DSA-65 generated server and client
        run: |
          script/run_drbssl_server_mldsa65_auto_generated.rb &
          sleep 3
          script/run_drbssl_client_mldsa65_auto_generated.rb

  drbssl-multi-cert:
    name: drbssl auto-generated ML-DSA-65/RSA multi cert (development)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl
      - *reinstall-openssl-gem

      - name: Clone drb
        run: git clone -b wip/support-pqc https://github.com/junaruga/ruby-drb.git ~/git/ruby/drb

      - name: Run drbssl multi cert server and client
        run: |
          script/run_drbssl_server_multi_cert_auto_generated.rb &
          sleep 3
          script/run_drbssl_client_multi_cert_auto_generated.rb

  drbssl-multi-cert-mldsa65-rsa:
    name: drbssl pre-generated ML-DSA-65/RSA multi cert (development)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl
      - *reinstall-openssl-gem

      - name: Clone drb
        run: git clone -b wip/support-pqc https://github.com/junaruga/ruby-drb.git ~/git/ruby/drb

      - name: Setup
        run: script/setup.sh

      - name: Run drbssl multi cert ML-DSA-65/RSA server and client
        run: |
          script/run_drbssl_server_multi_cert_mldsa65_rsa_pre_generated.rb &
          sleep 3
          script/run_drbssl_client_multi_cert_mldsa65_rsa_pre_generated.rb

  drbssl-multi-cert-mldsa65-rsa-client-cert:
    name: drbssl pre-generated ML-DSA-65/RSA multi cert with client cert (development)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['4.0', 'head']
    defaults:
      run:
        working-directory: drb
    steps:
      - uses: actions/checkout@v4
      - *setup-ruby
      - uses: ./.github/actions/setup-openssl
      - *reinstall-openssl-gem

      - name: Clone drb
        run: git clone -b wip/support-pqc https://github.com/junaruga/ruby-drb.git ~/git/ruby/drb

      - name: Setup
        run: script/setup.sh

      - name: Run drbssl multi cert ML-DSA-65/RSA client cert server and client
        run: |
          script/run_drbssl_server_multi_cert_mldsa65_rsa_client_cert_pre_generated.rb &
          sleep 3
          script/run_drbssl_client_multi_cert_mldsa65_rsa_client_cert_pre_generated.rb
